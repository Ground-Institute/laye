{
  "jobs": {
    "laye-p2p": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v5"
        },
        {
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "targets": "wasm32-unknown-unknown"
          }
        },
        {
          "uses": "jetli/wasm-pack-action@v0.4.0",
          "with": {
            "version": "v0.13.1"
          }
        },
        {
          "name": "Build laye-p2p for the browser",
          "run": "wasm-pack build --target web\nversion=\"${GITHUB_REF_NAME#v}\"\ncd pkg\nnpm pkg set version=\"$version\"\nnpm pack --pack-destination \"$GITHUB_WORKSPACE\"\n",
          "working-directory": "crates/laye-p2p"
        },
        {
          "uses": "softprops/action-gh-release@v2",
          "with": {
            "files": "laye-p2p-*.tgz"
          }
        }
      ]
    }
  },
  "name": "release",
  "on": {
    "push": {
      "tags": [
        "v*"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  }
}
