# laye, the app: proven on every push, photographed, and on TestFlight from main.
#
# "make it so i get to see a screenshot of the screen"
# "make sure it has serious ci. ilike QNTX app does"
#
# Modelled on teranos/QNTX-App's ci/testflight.nix. A run is green when App
# Store Connect says a tester can install the build, not when the upload
# returned (app/ci/delivered.py).
name: app

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  WASM_BINDGEN: "0.2.121"

jobs:
  # The workspace answers for itself, and the scene builds for the browser.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/cache@v4
        with:
          path: target
          key: workspace-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: workspace-${{ steps.rust.outputs.cachekey }}-
      # laye-grant builds its proto with prost, which runs protoc.
      - name: protoc
        run: sudo apt-get install -y --no-install-recommends protobuf-compiler
      - name: Every crate's tests
        run: cargo test --workspace --exclude laye-scene
      - name: The scene answers for every warning
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: cargo clippy --target wasm32-unknown-unknown -p laye-scene -- -D warnings

  # The page as a phone shows it, photographed: the stranger screen, the light
  # becoming the symbol, and the symbol locked.
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: target
          key: scene-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: scene-${{ steps.rust.outputs.cachekey }}-
      - name: wasm-bindgen ${{ env.WASM_BINDGEN }}
        run: |
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN/wasm-bindgen-$WASM_BINDGEN-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          echo "$PWD/wasm-bindgen-$WASM_BINDGEN-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: The scene, into the page
        run: app/scene.sh
      - name: Photograph the screen
        run: |
          python3 -m http.server 8932 --directory app >/dev/null 2>&1 &
          google-chrome --headless=new --no-sandbox --enable-unsafe-swiftshader --use-angle=swiftshader \
            --remote-debugging-port=9333 --user-data-dir="$RUNNER_TEMP/chrome" about:blank >/dev/null 2>&1 &
          until curl -s 127.0.0.1:9333/json/version >/dev/null; do sleep 0.5; done
          mkdir -p screens
          node app/ci/screens.mjs 9333 http://127.0.0.1:8932/web/index.html 8000:screens/laye.png
          node app/ci/screens.mjs 9333 http://127.0.0.1:8932/ci/known.html 4000:screens/becoming.png 30000:screens/known.png
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens/*.png

  # The app for a phone, signed by the team's certificate, and on TestFlight
  # from main or a dispatch.
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,wasm32-unknown-unknown
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            target
            app/target
          key: ios-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'app/Cargo.lock') }}
          restore-keys: ios-${{ steps.rust.outputs.cachekey }}-
      - name: wasm-bindgen ${{ env.WASM_BINDGEN }}
        run: |
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN/wasm-bindgen-$WASM_BINDGEN-aarch64-apple-darwin.tar.gz" | tar -xz
          echo "$PWD/wasm-bindgen-$WASM_BINDGEN-aarch64-apple-darwin" >> "$GITHUB_PATH"
      - name: The scene, into the page
        run: ./scene.sh
      # The wall in app/Cargo.toml is a list of denials, and this is what asks it.
      - name: The lib answers for every error
        run: cargo clippy --lib --target aarch64-apple-ios -- -D warnings
      - name: Signing material
        id: signing
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          if [ -n "$IOS_CERTIFICATE" ] && [ -n "$APPLE_API_KEY_CONTENT" ]; then
            echo "held=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::laye holds no Apple signing secrets yet: the app is proven, not signed"
            echo "held=false" >> "$GITHUB_OUTPUT"
          fi
      - name: laye's App ID and profile at Apple
        if: steps.signing.outputs.held == 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          python3 -m venv "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc/bin/pip" install --quiet 'pyjwt[crypto]' requests
          "$RUNNER_TEMP/asc/bin/python" ci/apple.py "$RUNNER_TEMP/laye.mobileprovision"
          echo "IOS_MOBILE_PROVISION=$(base64 < "$RUNNER_TEMP/laye.mobileprovision" | tr -d '\n')" >> "$GITHUB_ENV"
      - name: Fetch tauri-cli 2.11.4
        if: steps.signing.outputs.held == 'true'
        run: |
          curl -sSL -o cargo-tauri.zip https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.4/cargo-tauri-aarch64-apple-darwin.zip
          mkdir -p "$HOME/.cargo/bin"
          unzip -o -q cargo-tauri.zip -d "$HOME/.cargo/bin"
          rm cargo-tauri.zip
          cargo tauri --version
      - name: The Xcode project
        if: steps.signing.outputs.held == 'true'
        run: cargo tauri ios init
      - name: Sign against the profile, not an account
        if: steps.signing.outputs.held == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          PROVISIONING_PROFILE: laye
        run: |
          python3 ci/ios-project.py gen/apple/project.yml
          cd gen/apple && xcodegen generate
      - name: Build the signed IPA
        if: steps.signing.outputs.held == 'true'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: cargo tauri ios build --export-method app-store-connect --build-number ${{ github.run_number }}
      - name: Locate the IPA
        if: steps.signing.outputs.held == 'true'
        id: ipa
        run: |
          found=$(find gen -name '*.ipa' -type f | head -1)
          test -n "$found" || { find gen/apple/build -type f 2>/dev/null; echo "no ipa produced"; exit 1; }
          echo "path=$PWD/$found" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.held == 'true'
        with:
          name: laye-ipa
          path: ${{ steps.ipa.outputs.path }}
      # What reaches a phone is main, or a build somebody dispatched, as in QNTX-App.
      - name: Upload to TestFlight
        if: steps.signing.outputs.held == 'true' && vars.APPLE_APP_ID != '' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_APP_ID: ${{ vars.APPLE_APP_ID }}
          IPA: ${{ steps.ipa.outputs.path }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_CONTENT" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY.p8
          plist=$(mktemp)
          unzip -p "$IPA" 'Payload/*.app/Info.plist' > "$plist"
          bundle=$(plutil -extract CFBundleIdentifier raw "$plist")
          build=$(plutil -extract CFBundleVersion raw "$plist")
          short=$(plutil -extract CFBundleShortVersionString raw "$plist")
          echo "uploading $bundle $short ($build)"
          xcrun altool --upload-package "$IPA" --type ios \
            --apple-id "$APPLE_APP_ID" --bundle-id "$bundle" \
            --bundle-version "$build" --bundle-short-version-string "$short" \
            --api-key "$APPLE_API_KEY" --api-issuer "$APPLE_API_ISSUER"
          echo "BUILD=$build" >> "$GITHUB_ENV"
      - name: Delivered to testers
        if: steps.signing.outputs.held == 'true' && vars.APPLE_APP_ID != '' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          "$RUNNER_TEMP/asc/bin/python" ci/delivered.py wait "$BUILD"
