{
  "jobs": {
    "checks": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v5"
        },
        {
          "id": "rust",
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "components": "clippy",
            "targets": "wasm32-unknown-unknown"
          }
        },
        {
          "uses": "actions/cache@v4",
          "with": {
            "key": "workspace-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}",
            "path": "target",
            "restore-keys": "workspace-${{ steps.rust.outputs.cachekey }}-"
          }
        },
        {
          "name": "protoc",
          "run": "sudo apt-get install -y --no-install-recommends protobuf-compiler"
        },
        {
          "name": "Every crate's tests",
          "run": "cargo test --workspace --exclude laye-scene"
        },
        {
          "env": {
            "RUSTFLAGS": "--cfg getrandom_backend=\"wasm_js\""
          },
          "name": "The scene answers for every warning",
          "run": "cargo clippy --target wasm32-unknown-unknown -p laye-scene -- -D warnings"
        },
        {
          "uses": "cachix/install-nix-action@v31"
        },
        {
          "name": "Every workflow is what its nix says",
          "run": "for f in ci/*.nix; do\n  nix eval --json --file \"$f\" | jq . | diff - \".github/workflows/$(basename \"$f\" .nix).yml\"\ndone\n"
        }
      ]
    },
    "ios": {
      "defaults": {
        "run": {
          "working-directory": "app"
        }
      },
      "env": {},
      "runs-on": "macos-latest",
      "steps": [
        {
          "uses": "actions/checkout@v5"
        },
        {
          "id": "rust",
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "components": "clippy",
            "targets": "aarch64-apple-ios,wasm32-unknown-unknown"
          }
        },
        {
          "uses": "actions/cache@v4",
          "with": {
            "key": "ios-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'app/Cargo.lock') }}",
            "path": "target\napp/target",
            "restore-keys": "ios-${{ steps.rust.outputs.cachekey }}-"
          }
        },
        {
          "name": "ios-common v0.2.0",
          "run": "git clone -q --depth 1 --branch v0.2.0 https://github.com/teranos/ios-common \"$RUNNER_TEMP/ios-common\"\necho \"IOS_COMMON=$RUNNER_TEMP/ios-common/apple\" >> \"$GITHUB_ENV\"\n"
        },
        {
          "name": "wasm-bindgen 0.2.121",
          "run": "curl -sSL \"https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.121/wasm-bindgen-0.2.121-aarch64-apple-darwin.tar.gz\" | tar -xz\necho \"$PWD/wasm-bindgen-0.2.121-aarch64-apple-darwin\" >> \"$GITHUB_PATH\"\n"
        },
        {
          "name": "The scene, into the page",
          "run": "./scene.sh"
        },
        {
          "name": "The lib answers for every error",
          "run": "cargo clippy --lib --target aarch64-apple-ios -- -D warnings"
        },
        {
          "env": {
            "APPLE_API_KEY_CONTENT": "${{ secrets.APPLE_API_KEY_CONTENT }}",
            "IOS_CERTIFICATE": "${{ secrets.IOS_CERTIFICATE }}"
          },
          "id": "signing",
          "name": "Signing material",
          "run": "if [ -n \"$IOS_CERTIFICATE\" ] && [ -n \"$APPLE_API_KEY_CONTENT\" ]; then\n  echo \"held=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"::warning::no Apple signing secrets here: the app is proven, not signed\"\n  echo \"held=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"
        },
        {
          "env": {
            "APPLE_API_ISSUER": "${{ secrets.APPLE_API_ISSUER }}",
            "APPLE_API_KEY": "${{ secrets.APPLE_API_KEY }}",
            "APPLE_API_KEY_CONTENT": "${{ secrets.APPLE_API_KEY_CONTENT }}",
            "IOS_CERTIFICATE": "${{ secrets.IOS_CERTIFICATE }}",
            "IOS_CERTIFICATE_PASSWORD": "${{ secrets.IOS_CERTIFICATE_PASSWORD }}"
          },
          "if": "steps.signing.outputs.held == 'true'",
          "name": "App IDs, capabilities and profile at Apple",
          "run": "python3 -m venv \"$RUNNER_TEMP/asc\"\n\"$RUNNER_TEMP/asc/bin/pip\" install --quiet 'pyjwt[crypto]' requests\n\"$RUNNER_TEMP/asc/bin/python\" \"$IOS_COMMON/apple.py\" apple.json \"$RUNNER_TEMP/app.mobileprovision\"\necho \"IOS_MOBILE_PROVISION=$(base64 < \"$RUNNER_TEMP/app.mobileprovision\" | tr -d '\\n')\" >> \"$GITHUB_ENV\"\n"
        },
        {
          "if": "steps.signing.outputs.held == 'true'",
          "name": "Fetch tauri-cli 2.11.4",
          "run": "curl -sSL -o cargo-tauri.zip https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.4/cargo-tauri-aarch64-apple-darwin.zip\nmkdir -p \"$HOME/.cargo/bin\"\nunzip -o -q cargo-tauri.zip -d \"$HOME/.cargo/bin\"\nrm cargo-tauri.zip\ncargo tauri --version\n"
        },
        {
          "if": "steps.signing.outputs.held == 'true'",
          "name": "The Xcode project",
          "run": "cargo tauri ios init"
        },
        {
          "env": {
            "APPLE_DEVELOPMENT_TEAM": "${{ secrets.APPLE_DEVELOPMENT_TEAM }}",
            "PROVISIONING_PROFILE": "laye"
          },
          "if": "steps.signing.outputs.held == 'true'",
          "name": "Sign against the profile, not an account",
          "run": "python3 \"$IOS_COMMON/ios-project.py\" gen/apple/project.yml"
        },
        {
          "if": "steps.signing.outputs.held == 'true'",
          "name": "Generate the signed Xcode project",
          "run": "cd gen/apple && xcodegen generate"
        },
        {
          "env": {
            "APPLE_DEVELOPMENT_TEAM": "${{ secrets.APPLE_DEVELOPMENT_TEAM }}",
            "IOS_CERTIFICATE": "${{ secrets.IOS_CERTIFICATE }}",
            "IOS_CERTIFICATE_PASSWORD": "${{ secrets.IOS_CERTIFICATE_PASSWORD }}"
          },
          "if": "steps.signing.outputs.held == 'true'",
          "name": "Build the signed IPA",
          "run": "cargo tauri ios build --export-method app-store-connect --build-number ${{ github.run_number }}"
        },
        {
          "id": "ipa",
          "if": "steps.signing.outputs.held == 'true'",
          "name": "Locate the IPA",
          "run": "found=$(find gen -name '*.ipa' -type f | head -1)\ntest -n \"$found\" || { find gen/apple/build -type f 2>/dev/null; echo \"no ipa produced\"; exit 1; }\necho \"path=$PWD/$found\" >> \"$GITHUB_OUTPUT\"\n"
        },
        {
          "if": "steps.signing.outputs.held == 'true'",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "ipa",
            "path": "${{ steps.ipa.outputs.path }}"
          }
        },
        {
          "env": {
            "APPLE_API_ISSUER": "${{ secrets.APPLE_API_ISSUER }}",
            "APPLE_API_KEY": "${{ secrets.APPLE_API_KEY }}",
            "APPLE_API_KEY_CONTENT": "${{ secrets.APPLE_API_KEY_CONTENT }}",
            "APPLE_APP_ID": "${{ vars.APPLE_APP_ID }}",
            "IPA": "${{ steps.ipa.outputs.path }}"
          },
          "if": "steps.signing.outputs.held == 'true' && vars.APPLE_APP_ID != '' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')",
          "name": "Upload to TestFlight",
          "run": "sh \"$IOS_COMMON/upload.sh\" \"$IPA\" >> \"$GITHUB_ENV\""
        },
        {
          "env": {
            "APPLE_API_ISSUER": "${{ secrets.APPLE_API_ISSUER }}",
            "APPLE_API_KEY": "${{ secrets.APPLE_API_KEY }}",
            "APPLE_API_KEY_CONTENT": "${{ secrets.APPLE_API_KEY_CONTENT }}"
          },
          "if": "steps.signing.outputs.held == 'true' && vars.APPLE_APP_ID != '' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')",
          "name": "Delivered to testers",
          "run": "\"$RUNNER_TEMP/asc/bin/python\" \"$IOS_COMMON/delivered.py\" wait \"$BUILD\""
        }
      ]
    },
    "screens": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v5"
        },
        {
          "id": "rust",
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "targets": "wasm32-unknown-unknown"
          }
        },
        {
          "uses": "actions/cache@v4",
          "with": {
            "key": "scene-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}",
            "path": "target",
            "restore-keys": "scene-${{ steps.rust.outputs.cachekey }}-"
          }
        },
        {
          "name": "wasm-bindgen 0.2.121",
          "run": "curl -sSL \"https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.121/wasm-bindgen-0.2.121-x86_64-unknown-linux-musl.tar.gz\" | tar -xz\necho \"$PWD/wasm-bindgen-0.2.121-x86_64-unknown-linux-musl\" >> \"$GITHUB_PATH\"\n"
        },
        {
          "name": "The scene, into the page",
          "run": "app/scene.sh"
        },
        {
          "name": "Photograph the screen",
          "run": "python3 -m http.server 8932 --directory app >/dev/null 2>&1 &\ngoogle-chrome --headless=new --no-sandbox --enable-unsafe-swiftshader --use-angle=swiftshader \\\n  --remote-debugging-port=9333 --user-data-dir=\"$RUNNER_TEMP/chrome\" about:blank >/dev/null 2>&1 &\nuntil curl -s 127.0.0.1:9333/json/version >/dev/null; do sleep 0.5; done\nmkdir -p screens\nnode app/ci/screens.mjs 9333 http://127.0.0.1:8932/web/index.html 8000:screens/laye.png\nnode app/ci/screens.mjs 9333 http://127.0.0.1:8932/ci/known.html 4000:screens/becoming.png 30000:screens/known.png\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "screens",
            "path": "screens/*.png"
          }
        }
      ]
    }
  },
  "name": "app",
  "on": {
    "pull_request": {},
    "push": {},
    "workflow_dispatch": {}
  }
}
