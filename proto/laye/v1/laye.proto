syntax = "proto3";

package laye.v1;

// A key is named by its did:key. A person is a key that signs only when its
// human does. An agent is a key one session holds. A hash is sha256. A time
// is unix seconds. A field named for a statement holds that statement's id.

// The signature is ed25519 over "laye-claim/v1|" followed by `claim`, as
// carried.
message Statement {
  // A serialized Claim. Its sha256 is the statement's id.
  bytes claim = 1;
  bytes signature = 2;
  string signer = 3;
}

message Claim {
  oneof says {
    Grant grant = 1;
    Authorization authorization = 2;
    Ask ask = 3;
    Served served = 4;
    Refused refused = 5;
    Revoke revoke = 6;
    Stands stands = 7;
  }
}

// Signed by `giver`.
message Grant {
  Kind kind = 1;
  // A person.
  string giver = 2;
  // The giver's named agent, whose transcripts are read.
  string named_agent = 3;
  oneof to {
    // Any agent this person authorizes.
    string person = 4;
    // This agent. It needs no Authorization.
    string agent = 5;
  }
  // A repository, as host/owner/name. Empty: the grant opens nothing.
  string repo = 6;
  Opens opens = 7;
  // The key that answers for `named_agent`'s transcripts. An answer signed by
  // another key is void.
  string keeper = 8;
  Narrow narrow = 9;
  // 0: until revoked.
  uint64 until = 10;
  uint64 issued_at = 11;
}

enum Kind {
  // Grants nothing.
  KIND_UNSPECIFIED = 0;
  READ = 1;
  // Speaking.
  reserved 2;
}

enum Opens {
  // Opens nothing.
  OPENS_UNSPECIFIED = 0;
  // None of the transcripts.
  CHECKS = 1;
  // The transcripts.
  TRANSCRIPTS = 2;
}

enum Narrow {
  // Narrowed to the first agent that reads: from then on it serves only that
  // agent.
  TO_THAT_AGENT = 0;
  // It serves every agent its person authorizes.
  NOT_NARROWED = 1;
}

// Held by the grant's keeper.
enum State {
  STATE_UNSPECIFIED = 0;
  // Signed, and not narrowed. Under NOT_NARROWED, and to one agent, a grant is GIVEN
  // until REVOKED or ENDED.
  GIVEN = 1;
  // To a person, under TO_THAT_AGENT: from GIVEN, by the first Served.
  NARROWED = 2;
  // From NARROWED, when that agent's Authorization is revoked or ended. It serves no one.
  SPENT = 3;
  // From any state, by the giver's Revoke. It serves no one.
  REVOKED = 4;
  // From any state, when `until` has passed. It serves no one.
  ENDED = 5;
}

// Signed by the grant's keeper, to its giver and to whom it was given, on
// each change of state.
message Stands {
  bytes grant = 1;
  State state = 2;
  // NARROWED and SPENT: the agent it is narrowed to.
  string agent = 3;
  // NARROWED: the Served that narrowed it.
  bytes served = 4;
  uint64 issued_at = 5;
}

// Signed by the person a grant is to. An agent uses that grant only with one.
message Authorization {
  bytes grant = 1;
  // An agent of the signer.
  string agent = 2;
  // 0: until revoked.
  uint64 until = 3;
  uint64 issued_at = 4;
}

// Signed by `reader`, and sent to the grant's keeper with the Grant and the
// Authorization. It is answered by a Served or a Refused.
message Ask {
  bytes grant = 1;
  // Empty when the grant is to `reader` itself.
  bytes authorization = 2;
  string reader = 3;
  // The position in `named_agent`'s transcripts on `repo` after which to answer.
  uint64 after = 4;
  uint64 issued_at = 5;
}

// Signed by the grant's keeper, to the reader and to the giver.
message Served {
  bytes ask = 1;
  uint64 after = 2;
  uint64 upto = 3;
  // The hash of the stretch: its bodies in order, each after its length as
  // eight bytes, the highest first.
  bytes digest = 4;
  uint64 issued_at = 5;
}

// Signed by the grant's keeper, to the reader.
message Refused {
  bytes ask = 1;
  Why why = 2;
  uint64 issued_at = 3;
}

// Checked in this order. The first that does not hold is the Why. An Ask or
// a Grant whose signature does not verify gets no answer.
enum Why {
  WHY_UNSPECIFIED = 0;
  // The Grant names another keeper.
  NOT_THIS_KEEPER = 1;
  // The Grant is not of kind READ.
  NOT_A_READ = 2;
  // `opens` is unspecified, or `repo` is empty.
  OPENS_NOTHING = 3;
  REVOKED_GRANT = 4;
  ENDED_GRANT = 5;
  SPENT_GRANT = 6;
  // NARROWED, and `reader` is not the agent it is narrowed to.
  NARROWED_TO_ANOTHER = 7;
  // To a person, and no Authorization came: or it does not verify, is not signed by
  // that person, or names another grant.
  NOT_AUTHORIZED = 8;
  REVOKED_AUTHORIZATION = 9;
  ENDED_AUTHORIZATION = 10;
  // `reader` is not the Authorization's agent, or not the agent the Grant is to.
  NOT_THE_AGENT = 11;
  // This Ask was answered before.
  SEEN_BEFORE = 12;
  // `issued_at` is more than 300 seconds from the keeper's clock.
  OUT_OF_TIME = 13;
}

// Signed by the signer of `statement`: a Grant or an Authorization. It counts from
// when the keeper has it.
message Revoke {
  bytes statement = 1;
  uint64 issued_at = 2;
}
