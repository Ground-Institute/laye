[workspace]
resolver = "2"
members = [
    "crates/laye-front",
    "crates/laye-grant",
    "crates/laye-me",
    "crates/laye-net",
    "crates/laye-p2p",
    "crates/laye-peer",
    "crates/laye-protocol",
    "crates/laye-scene",
]
# The app builds on its own: Tauri, and the targets a phone is.
exclude = ["app"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
unwrap_in_result = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"

[workspace.dependencies]
sacred-error = { git = "https://github.com/teranos/sacred-error", rev = "a71a5150d9766e163ba9a0481da33dc3f1debbeb" }
thiserror = "2"

# The scene a phone downloads before it shows anything: small over fast.
[profile.scene]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
debug = false
panic = "abort"
