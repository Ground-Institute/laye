[workspace]
resolver = "2"
members = [
    "crates/laye-grant",
    "crates/laye-me",
    "crates/laye-net",
    "crates/laye-p2p",
    "crates/laye-peer",
    "crates/laye-protocol",
]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
unwrap_in_result = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"

[workspace.dependencies]
sacred-error = { git = "https://github.com/teranos/sacred-error", rev = "aaf9a743a2b9b0d22c6059dddbfdc4897f6528c7" }
thiserror = "2"
