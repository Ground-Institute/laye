[package]
name = "laye-front"
version = "0.0.0"
edition = "2024"
description = "laye in front of QNTX: it owns identity, and stays when QNTX goes down."
license = "MIT"

[lints]
workspace = true

[dependencies]
laye-me = { path = "../laye-me" }
laye-peer = { path = "../laye-peer" }
libp2p-identity = { version = "=0.2.14", features = ["ed25519"] }
sacred-error.workspace = true
thiserror.workspace = true
a2a = { package = "a2a-lf", version = "=0.4.2" }
base64 = "=0.22.1"
bytes = "=1.12.1"
http-body-util = "=0.1.4"
hyper = { version = "=1.10.1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "=0.1.20", features = ["tokio", "client-legacy", "server", "server-auto", "http1", "http2"] }
rand = "=0.8.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.143"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "fs", "io-util"] }
toml = "=0.8.23"
sha2 = "=0.10.9"
ciborium = "=0.2.2"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "std"] }

[dev-dependencies]
futures = "=0.3.32"
