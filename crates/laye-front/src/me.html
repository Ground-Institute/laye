<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>laye</title>
<!--
  "but laye needs to feel like laye"
  "so dont copy cat entirely"
  Glass, its shadow, and how a press rises and settles are vitreous's,
  taken as vitreous writes them. What the glass is made of, and what stands
  behind it, are laye's: its night, the lit stage over it, and the ground
  symbol the sphere becomes (app/screens).
-->
<link rel="stylesheet" href="/laye/web/vitreous/vitreous.css">
<style>
  :root {
    color-scheme: dark;
    /* What vitreous asks a site to declare: its shadow's ink, and what its
       glass is made of. laye's glass is its stage's night blue. */
    --ink-rgb: 0 0 0;
    --glass-rgb: 22 26 38;
    --ground: #050608;
    --stage: #1e2233;
    --ink: #e6e2e2;
    --quiet: #8b90a0;
    --symbol: #f0d9d6;
    /*
      "laye s calm"
      Red says only that something went wrong.
    */
    --wrong: #e88;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 14px/1.5 ui-monospace, Menlo, monospace;
  }
  /* The stage, lit over the night, and the symbol over it: what the glass
     is seen against. */
  .stage {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(ellipse 90% 34% at 50% 34%, var(--stage) 0 70%, transparent 71%),
      var(--ground);
  }
  /* One column, top to bottom, in the page's own flow: laye's name, the
     symbol, the glass. The page scrolls when there is more than fits, so
     nothing is ever out of reach. */
  .column {
    display: flex; flex-direction: column; align-items: center;
    min-height: 100%; box-sizing: border-box;
    padding: 2rem 16px 3rem;
  }
  h1 { margin: 0; font-weight: 400; font-size: 1.6rem; letter-spacing: 0.5em; padding-left: 0.5em; }
  .symbol {
    margin: 1.5rem 0 2rem;
    font: 6rem/1 ui-sans-serif, system-ui, sans-serif;
    color: var(--symbol);
    text-shadow: 0 0 18px rgb(240 217 214 / 0.45);
    user-select: none;
  }
  main {
    width: min(24rem, 100%);
    box-sizing: border-box;
    padding: 1.2em 1.2em;
    text-align: center;
    /* Drawn once, whole: until then it is not there to reach for. */
    visibility: hidden;
  }
  main.drawn { visibility: visible; }
  /* A press that is running: everything waits for it, and says so. */
  main.busy button { opacity: 0.6; cursor: progress; }
  /*
    "transparancy"
    "opaque when not logged in"
    Signed out, the glass is opaque: nothing of the stage is seen through it.
    Signed in, it is vitreous's glass, and the stage shows through.
  */
  main.closed { background: rgb(var(--glass-rgb) / 1); }
  main { transition: background-color 0.6s; }
  @media (prefers-reduced-motion: reduce) { main { transition: none; } }
  #who { display: grid; grid-template-columns: auto 1fr; gap: 0.2em 0.8em; align-items: center; text-align: left; margin: 0.2em 0 0.8em; }
  #who img, #who .initial { grid-row: span 2; width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
  #who .initial { display: grid; place-items: center; background: var(--glass-thin); font-size: 18px; }
  #who .name { font-size: 15px; overflow-wrap: anywhere; }
  #who .line { color: var(--quiet); font-size: 12px; overflow-wrap: anywhere; }
  .link { background: none; border: none; padding: 0; color: var(--quiet); text-decoration: underline; font-size: 12px; cursor: pointer; border-radius: 4px; }
  .tagline { margin: 0.6rem 0 0; color: var(--quiet); font-size: 12px; letter-spacing: 0.15em; }
  .trust { margin-top: 1em; padding-top: 0.8em; border-top: 1px solid var(--glass-border); }
  #who { margin: 0 0 0.5em; overflow-wrap: anywhere; }
  .presses { display: grid; gap: 0.6em; margin: 1em 0; }
  button {
    padding: 0.7em 1em;
    color: var(--ink);
    font: inherit;
    overflow-wrap: anywhere;
    white-space: normal;
  }
  p { margin: 0.3em 0; overflow-wrap: anywhere; }
  .quiet { color: var(--quiet); font-size: 12px; }
  .bad { color: var(--wrong); }
  #said { min-height: 1.5em; margin: 0; }
  /*
    "and laye should have no sharp edges"
  */
  main { border-radius: 20px; }
  button { border-radius: 12px; }
  .pressable:focus-visible { outline-offset: 3px; border-radius: 12px; }
  [hidden] { display: none !important; }
  /* A key asking to be you: its code is what you compare, so it stands out. */
  .code { font-size: 1.6em; letter-spacing: 0.15em; margin: 0.4em 0; }
  /* What waits, as the room draws what was said: who, small; what, larger. */
  #waits { text-align: left; margin: 1em 0; }
  .waiting { border-top: 1px solid var(--glass-border); padding: 0.8em 0; }
  .waiting .from { color: var(--quiet); font-size: 12px; }
  .waiting .says { white-space: pre-wrap; font-size: 15px; line-height: 1.6; }
  .acts { display: flex; gap: 0.5em; flex-wrap: wrap; margin-top: 0.6em; }
  .acts button { padding: 0.5em 0.9em; }
</style>
</head>
<body>
<div class="stage"></div>
<div class="column">
<h1>laye</h1>
<p class="tagline">identity · authentication · network · A2A</p>
<div class="symbol" aria-hidden="true">⏚</div>
<main class="glass shadow-glass closed">
  <div id="who" hidden></div>
  <div class="presses" id="in">
    <button type="button" class="glass-thin pressable" id="signin">Sign in with your passkey</button>
  </div>
  <div class="presses" id="make" hidden></div>
  <div class="presses" id="yes" hidden></div>
  <section id="waits" hidden></section>
  <p id="said" role="status" aria-live="polite"></p>
  <p class="quiet trust" id="where"></p>
</main>
</div>
<script type="module">
// "big piece of laye is wasm"
// This browser's key is laye's own, kept by laye's wasm. A passkey is made on
// what that key proved, and the key the passkey derives (the PRF) is laye's
// wasm's to make and sign with.
import load, * as laye from '/laye/web/laye_p2p.js';

const CEREMONY = {{ceremony}};
const SIGNERS = {{signers}};
// Fixed forever, as QNTX's: change it and every passkey derives another key.
const PRF_SALT = new TextEncoder().encode('qntx/passkey-owner/v1');

const said = (words, bad) => {
  const p = document.getElementById('said');
  p.textContent = words;
  p.className = bad ? 'bad' : '';
};
const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replaceAll('+', '-').replaceAll('/', '_').replace(/=+$/, '');
const unb64url = (s) => {
  const t = s.replaceAll('-', '+').replaceAll('_', '/');
  const raw = atob(t + '='.repeat((4 - t.length % 4) % 4));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0)).buffer;
};
const utf8 = (s) => new TextEncoder().encode(s);

async function asked(path, body) {
  const answer = await fetch(path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: body === undefined ? {} : { 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
    credentials: 'same-origin',
  });
  const read = await answer.json().catch(() => ({}));
  if (!answer.ok) throw new Error(read.error || read.error_description || `laye answered ${answer.status}`);
  return read;
}

function lastError() {
  const all = JSON.parse(laye.errors() || '[]');
  return all.length ? JSON.stringify(all[all.length - 1]) : '';
}

// "it doesnt respect the user, as if tis sayign, dont trust me"
// Everything laye is asked for is asked first, and the panel is drawn once
// with all of it: nothing moves under the person while they reach for it.
// After that only what they pressed changes.
const asking = new URLSearchParams(location.search).get('user_code');

async function gather() {
  let me = null;
  try { me = await asked('/laye/passkey/me'); } catch { me = null; }
  if (!me) {
    const held = JSON.parse(laye.bindings());
    let providers = [];
    if (!held.length) {
      const answer = await fetch(CEREMONY + '/auth/binding/providers', { credentials: 'include' });
      providers = ((await answer.json()).providers || []).filter((p) => p.kind === 'redirect');
    }
    return { me, held, providers };
  }
  let prove = null;
  if (!me.name) {
    const answer = await fetch(CEREMONY + '/auth/binding/providers', { credentials: 'include' }).catch(() => null);
    const providers = answer && answer.ok ? ((await answer.json()).providers || []).filter((p) => p.kind === 'redirect') : [];
    prove = providerOf(me.person, providers) || null;
  }
  const [shown, waits] = await Promise.all([
    asking
      ? asked('/laye/device/shown?user_code=' + encodeURIComponent(asking)).catch((e) => ({ error: String(e.message || e) }))
      : Promise.resolve(null),
    asked('/laye/collected').catch((e) => ({ error: String(e.message || e), collected: [] })),
  ]);
  return { me, prove, shown, collected: waits.collected || [], waitsError: waits.error };
}

function el(tag, text, className) {
  const made = document.createElement(tag);
  if (text !== undefined) made.textContent = text;
  if (className) made.className = className;
  return made;
}

function press(label, act) {
  const b = el('button', label, 'glass-thin pressable');
  b.type = 'button';
  b.addEventListener('click', act);
  return b;
}

/** While a press runs, every press waits for it: none is pressed twice, and
 *  none is pressed under another. */
function busy(on) {
  const main = document.querySelector('main');
  main.classList.toggle('busy', on);
  main.setAttribute('aria-busy', on ? 'true' : 'false');
  for (const b of main.querySelectorAll('button')) b.disabled = on;
}

/** Runs what a press does, says it is running, and draws the panel again
 *  once, with what laye says now. */
async function pressed(does, doing) {
  busy(true);
  if (doing) said(doing);
  try {
    const words = await does();
    await draw();
    if (words) said(words);
  } catch (e) {
    await sayFailure(e);
  } finally {
    busy(false);
  }
}

/** A moment as this clock says it, 24-hour, and how far off it is. */
function when(stamped) {
  if (!stamped) return '';
  const at = new Date(stamped);
  if (Number.isNaN(at.getTime())) return stamped;
  const clock = at.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
  const today = at.toDateString() === new Date().toDateString();
  const day = today ? '' : at.toLocaleDateString([], { weekday: 'short' }) + ' ';
  const minutes = Math.round((at.getTime() - Date.now()) / 60000);
  const far = Math.abs(minutes) < 60 ? `${Math.abs(minutes)} min` : `${Math.round(Math.abs(minutes) / 6) / 10} h`;
  return `${day}${clock} (${minutes >= 0 ? 'in ' + far : far + ' ago'})`;
}

function makeNodes(got) {
  if (got.held.length) {
    const names = got.held.map((b) => b.claim.handle || b.claim.canonical_id).join(', ');
    return [press('Make a passkey as ' + names, () => pressed(() => enrol(), 'Proving this browser’s key...'))];
  }
  return got.providers.map((p) => press('Prove your ' + p.label + ' account', () => goProve(p)));
}

/** A DID as a person can compare it: its start and its end. */
const short = (did) => did.length > 24 ? `${did.slice(8, 16)}…${did.slice(-6)}` : did;

/** A moment in seconds, as this clock says it. */
const clock = (secs) => when(new Date(secs * 1000).toISOString());

/** Who is signed in, as they know themselves: their photo, their name, the
 *  account it came from, how long the session lasts, and a way out. */
function whoNodes(me) {
  const name = me.name || me.account || me.person;
  const face = me.picture ? el('img') : el('div', name.slice(0, 1).toUpperCase(), 'initial');
  if (me.picture) {
    face.src = me.picture;
    face.alt = '';
    face.referrerPolicy = 'no-referrer';
  }
  const account = me.account || me.person;
  const parts = [];
  if (account !== name) parts.push(account);
  if (me.level === 'ROOT') parts.push('root');
  parts.push(`signed in until ${clock(me.until)}`);
  const line = el('div', parts.join(' · ') + ' · ', 'line');
  const out = el('button', 'Not you? Sign out', 'link');
  out.type = 'button';
  out.addEventListener('click', () => pressed(async () => {
    await asked('/laye/passkey/out', {});
    return 'Signed out. Your passkey stays yours; sign in with it again any time.';
  }, 'Signing out...'));
  line.append(out);
  return [face, el('div', name, 'name'), line];
}

/** The provider a person's account is at, to ask it for their name and photo. */
function providerOf(person, providers) {
  const at = person.startsWith('https://') ? 'mastodon' : person.split(':')[0];
  return providers.find((p) => p.id === at);
}

function goProve(p) {
  const go = new URLSearchParams({ provider: p.id, peer_pubkey_hex: laye.self_peer_id(), page: '/laye/me' });
  if (p.host_prompt) {
    const host = prompt(p.host_prompt, p.host_placeholder);
    if (!host) return;
    go.set('host', host);
  }
  location.assign(CEREMONY + '/auth/binding/go?' + go);
}

// A key asking to be yours, by the code it printed. Only your passkey session
// says yes to it, and before it does, it is told what that lets the key do.
function yesNodes(shown) {
  if (!shown) return [];
  if (shown.error) return [el('p', shown.error, 'bad')];
  const nodes = [
    el('p', `${shown.label} asks to be you. It asked ${clock(shown.asked_at)}.`),
    el('p', 'Check this code is the one the key printed:', 'quiet'),
    el('p', shown.user_code, 'code'),
    el('p', `key ${short(shown.did)}`, 'quiet'),
  ];
  if (shown.said) {
    nodes.push(el('p', 'You said yes to it.', 'quiet'));
    return nodes;
  }
  nodes.push(el('p', `Saying yes lets it admit your sessions at laye and be named as you. The request closes ${clock(shown.until)}.`, 'quiet'));
  nodes.push(press('Yes, this key is me', () => pressed(async () => {
    const done = await asked('/laye/device/approve', { user_code: shown.user_code });
    return `${done.label} is yours now.`;
  }, 'Saying yes...')));
  return nodes;
}

// "and as a human i can observe it"
// What agents said to your agents, held until it is due or you release it.
function waitsNodes(got) {
  if (got.waitsError) return [el('p', got.waitsError, 'bad')];
  if (!got.collected.length) return [el('p', 'Nothing waits for your agents.', 'quiet')];
  return got.collected.map((one) => {
    const block = el('div', undefined, 'waiting');
    const due = one.due ? `goes ${when(one.due)}` : 'goes when you say';
    block.append(el('p', `For ${one.to}: ${due}` + (one.held_until ? `, held until ${when(one.held_until)}` : '')));
    for (const w of one.waiting) {
      block.append(el('p', `${w.from}, ${when(w.at)}${w.edited ? ', changed by you' : ''}`, 'from'));
      block.append(el('p', w.says, 'says'));
    }
    if (one.failure) block.append(el('p', `Not delivered since ${when(one.failing_since)}, ${one.tries} tries: ${one.failure}`, 'bad'));
    const acts = el('div', undefined, 'acts');
    // What is pressed goes as it was seen: these ids, nothing that came in since.
    const ids = one.waiting.map((w) => w.id);
    const act = (doing, body, words) => () => pressed(async () => {
      await asked('/laye/collected/act', { did: one.did, ...body });
      return words;
    }, doing);
    acts.append(press('Release now', act('Releasing...', { act: 'release', ids }, `Released to ${one.to}.`)));
    acts.append(press('Later', act('Passing it on...', { act: 'later' }, 'Passed to the next delivery.')));
    // Cancelled is never delivered, and cannot be taken back: it is asked twice.
    const cancel = press('Cancel', () => {
      const sure = el('div', undefined, 'acts');
      sure.append(el('p', `Cancel what waits for ${one.to}? It will never reach it.`, 'quiet'));
      sure.append(press('Yes, cancel it', act('Cancelling...', { act: 'cancel' }, 'Cancelled.')));
      const keep = press('Keep it', () => sure.replaceWith(acts));
      sure.append(keep);
      acts.replaceWith(sure);
      keep.focus();
    });
    acts.append(cancel);
    block.append(acts);
    return block;
  });
}

async function draw() {
  const got = await gather();
  // Everything below is one synchronous change: the browser draws it once.
  const signedIn = !!got.me;
  document.querySelector('main').classList.toggle('closed', !signedIn);
  document.getElementById('who').hidden = !signedIn;
  document.getElementById('who').replaceChildren(...(signedIn ? whoNodes(got.me) : []));
  document.getElementById('in').hidden = signedIn;
  document.getElementById('make').hidden = signedIn;
  document.getElementById('make').replaceChildren(...(signedIn ? [] : makeNodes(got)));
  const yes = signedIn ? yesNodes(got.shown) : [];
  if (signedIn && got.prove) {
    const show = el('button', `Show your name and photo here (asks ${got.prove.label})`, 'link');
    show.type = 'button';
    show.addEventListener('click', () => goProve(got.prove));
    yes.push(show);
  }
  document.getElementById('yes').hidden = !yes.length;
  document.getElementById('yes').replaceChildren(...yes);
  document.getElementById('waits').hidden = !signedIn;
  document.getElementById('waits').replaceChildren(...(signedIn ? waitsNodes(got) : []));
  if (!signedIn && asking) said('Sign in with your passkey to say whether this key is you.');
  document.querySelector('main').classList.add('drawn');
  // The next thing to press has the focus: Enter does it.
  const next = document.querySelector('main section:not([hidden]) button, main .presses:not([hidden]) button');
  if (next && !document.querySelector('main.busy')) next.focus({ preventScroll: true });
}

async function cameBack(ticket) {
  history.replaceState(null, '', location.pathname);
  const answer = await fetch(CEREMONY + '/auth/binding/result?ceremony=' + encodeURIComponent(ticket), { credentials: 'include' });
  if (!answer.ok) throw new Error('the account was not proven: ' + answer.status);
  const { binding, name, picture } = await answer.json();
  laye.accept_binding(JSON.stringify(binding));
  if (!JSON.parse(laye.bindings()).length) throw new Error('laye did not keep the binding: ' + lastError());
  // What the provider showed the person as, kept with the passkey they make,
  // or now, when they are already signed in.
  const shown = { name: name || '', picture: picture || '', account: binding.claim.handle || binding.claim.canonical_id };
  try { sessionStorage.setItem('laye.shown', JSON.stringify(shown)); } catch { /* asked again next time */ }
  await asked('/laye/person', { binding, shown }).catch(() => null);
}

/** The PRF's 32 bytes for this credential: on create where the platform gives
 *  them, else on a get answering the same challenge (as QNTX-Web's prfSeed). */
async function seedOf(credential, challenge) {
  const onCreate = credential.getClientExtensionResults().prf;
  if (onCreate?.results?.first) return new Uint8Array(onCreate.results.first);
  if (!onCreate?.enabled) return null;
  const got = await navigator.credentials.get({ publicKey: {
    challenge, allowCredentials: [{ id: credential.rawId, type: 'public-key' }],
    userVerification: 'required', extensions: { prf: { eval: { first: PRF_SALT } } },
  } });
  const onGet = got?.getClientExtensionResults().prf;
  return onGet?.results?.first ? new Uint8Array(onGet.results.first) : null;
}

async function enrol() {
  said('Proving this browser’s key...');
  const { challenge } = await asked('/laye/challenge');
  const signature = laye.sign(utf8(challenge));
  if (!signature.length) throw new Error('laye did not sign: ' + lastError());
  const options = await asked('/laye/passkey/enrol/begin', {
    did: laye.did(), signature: b64url(signature), challenge, bindings: JSON.parse(laye.bindings()),
    shown: storedShown(),
  });
  const text = options.publicKey.challenge;
  options.publicKey.challenge = unb64url(text);
  options.publicKey.user.id = unb64url(options.publicKey.user.id);
  options.publicKey.extensions = { prf: { eval: { first: PRF_SALT } } };
  // A browser with no store of its own reaches a phone instead (QNTX-Web
  // madeWhere): asked for the platform, it would find none.
  if (!await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()) {
    delete options.publicKey.authenticatorSelection.authenticatorAttachment;
  }
  said('Waiting for your passkey...');
  const credential = await navigator.credentials.create(options);
  const seed = await seedOf(credential, options.publicKey.challenge);
  if (!seed) throw new Error('this authenticator cannot derive a key, so the passkey would belong to nobody');
  const made = await asked('/laye/passkey/enrol/finish', {
    id: credential.id, rawId: b64url(credential.rawId), type: credential.type,
    response: {
      clientDataJSON: b64url(credential.response.clientDataJSON),
      attestationObject: b64url(credential.response.attestationObject),
    },
    user_did: laye.owner_did(seed),
    user_did_signature: b64url(laye.owner_sign(seed, utf8(text))),
  });
  remember(credential.id);
  return 'Your passkey is made, and you are signed in.';
}

// What the provider last showed this person as, in this tab.
function storedShown() {
  try { return JSON.parse(sessionStorage.getItem('laye.shown') || 'null'); } catch { return null; }
}

// The passkeys this browser made here, so a sign-in names them alone.
function made() {
  try { return JSON.parse(localStorage.getItem('laye.passkeys') || '[]'); } catch { return []; }
}
function remember(id) {
  try { localStorage.setItem('laye.passkeys', JSON.stringify([...new Set([...made(), id])])); } catch { /* kept nowhere */ }
}

async function signIn() {
  const options = await asked('/laye/passkey/signin/begin', { ids: made() });
  options.publicKey.allowCredentials = (options.publicKey.allowCredentials || [])
    .map((c) => ({ ...c, id: unb64url(c.id) }));
  const text = options.publicKey.challenge;
  options.publicKey.challenge = unb64url(text);
  options.publicKey.extensions = { prf: { eval: { first: PRF_SALT } } };
  said('Waiting for your passkey...');
  const got = await navigator.credentials.get(options);
  const seed = got.getClientExtensionResults().prf?.results?.first;
  const owner = seed ? {
    user_did: laye.owner_did(new Uint8Array(seed)),
    user_did_signature: b64url(laye.owner_sign(new Uint8Array(seed), utf8(text))),
  } : {};
  const answered = await asked('/laye/passkey/signin/finish', {
    id: got.id, rawId: b64url(got.rawId), type: got.type,
    response: {
      clientDataJSON: b64url(got.response.clientDataJSON),
      authenticatorData: b64url(got.response.authenticatorData),
      signature: b64url(got.response.signature),
      userHandle: got.response.userHandle ? b64url(got.response.userHandle) : '',
    },
    ...owner,
  });
  return `Signed in as ${answered.person}.`;
}

// A cancelled biometric is a person changing their mind, or a browser that
// holds no passkey of laye's yet: said as that, not as a failure. A session
// that ended is said as that, and the page asks for the passkey again.
const cancelled = (e) => e instanceof Error && e.name === 'NotAllowedError';
async function sayFailure(e) {
  if (cancelled(e)) {
    said('Nothing was done. If you have no passkey here yet, prove an account below and make one.');
    return;
  }
  const why = String(e.message || e);
  if (/no person's session|session is over|session does not verify/.test(why)) {
    await draw();
    said('Your session ended, so nothing was done. Sign in with your passkey and press it again.');
    return;
  }
  said(why, true);
}
document.getElementById('signin').addEventListener('click', () => pressed(() => signIn(), 'Waiting for your passkey...'));

// Where the person is, and what laye holds of them: said, not implied.
document.getElementById('where').textContent =
  `laye at ${location.host}. Your passkey's private part never leaves your device; laye keeps its public key.`;

try {
  await load();
  await laye.init(JSON.stringify({ bootstrap_addrs: [], binding_signers: SIGNERS }));
  if (!laye.did()) throw new Error('laye did not start: ' + lastError());
  const ticket = new URLSearchParams(location.search).get('ceremony');
  if (ticket) {
    await cameBack(ticket);
  }
  await draw();
} catch (e) {
  said(String(e.message || e), true);
  document.querySelector('main').classList.add('drawn');
}
</script>
</body>
</html>
