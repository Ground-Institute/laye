[package]
name = "laye-scene"
version = "0.0.0"
edition = "2024"
description = "The scene laye's login is drawn on."
license = "MIT"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The bevy teranos/laye's bevy-starter pins. webgl2 and not webgpu: the page
# runs in WKWebView as well as in a browser.
bevy = { version = "=0.19.0", default-features = false, features = [
    "default_app",
    "3d_api",
    "3d_bevy_render",
    "tonemapping_luts",
    "bevy_winit",
    "webgl2",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.121"
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
getrandom_v02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }
